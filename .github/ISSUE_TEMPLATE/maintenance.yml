name: "유지보수 작업"
description: "기존 기능 수정·버그 수정 등 유지보수 작업을 시작하기 전, 에이전트에게 필요한 6개 항목을 정리합니다."
title: "[유지보수] "
labels:
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        이 양식의 6개 항목은 에이전트가 작업을 시작하는 데 필요한 최소 정보입니다.
        내용이 요구사항·아키텍처·하네스 핵심 규칙(`docs/harness/01-ssot.md` §0·§0-1)과 충돌하면
        에이전트는 임의로 진행하지 않고 `NEED_HUMAN`을 선언한 뒤 사람에게 넘깁니다.

  - type: textarea
    id: background
    attributes:
      label: "1. 배경 — 왜 필요한가"
      description: "이 유지보수가 필요한 이유. 버그 재현 방법, 영향 범위, 관련 Issue/PR 링크 등."
      placeholder: |
        예) 팝업 정산 화면에서 시식 수량이 차감분보다 커도 저장되는 버그를 발견함 (INV-6 위반).
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "2. 변경할 내용 — 무엇을 수정하는가"
      description: "수정 대상 파일·함수·화면을 가능한 한 구체적으로 적어주세요."
      placeholder: |
        예) src/lib/popup.ts의 settlePopupTx()에 시식 수량 > 차감분 검증 추가
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 3. 종료 조건 작성 가이드
        실행해서 **참/거짓을 바로 판정**할 수 있도록 기준·관계·기대 결과를 구체적으로 적어주세요.
        단, **특정 숫자(예: 100개, 101개)나 특정 날짜(예: 2026-09-20)를 종료 조건에 직접 넣지 마세요.**
        구체적인 값은 테스트 코드 안의 예시 데이터일 뿐이며, 값이 바뀌어도 종료 조건 자체는 그대로 참이어야 합니다.
        그래서 값 대신 **"~보다 크면", "~이하이면", "~일 이내로 남으면"처럼 관계·조건으로 표현**합니다.

        **안 되는 예 1 (추상적 — 참/거짓 판정 불가)**
        - 시식 수량 검증이 잘 동작한다
        - 팝업 정산 성능이 개선된다

        **안 되는 예 2 (특정 숫자·날짜에 고정 — 값이 바뀌면 조건 자체가 무의미해짐)**
        - 시식 입력값이 101개면 예외가 발생한다
        - 2026-09-20 이전에 입고된 로트는 정상 표시된다

        **되는 예 (관계·조건으로 표현 — 값과 무관하게 항상 참/거짓 판정 가능)**
        - 시식 입력값이 차감분보다 크면 정산 요청이 예외를 던지고 Lot 수량은 요청 전과 동일하게 유지된다
        - 시식 입력값이 차감분 이하이면 정상 저장되고, 판매 수량은 "차감분 − 시식 입력값"으로 기록된다
        - 유통기한이 상품별 설정 임계일 이내로 남은 로트만 "임박"으로 표시된다
        - 동일한 정산 요청을 반복해도 Movement 레코드가 중복 생성되지 않는다

  - type: textarea
    id: done-condition
    attributes:
      label: "3. 종료 조건 — 무엇이 참이면 완료인가"
      description: "위 가이드에 따라 기준·관계·기대 결과가 드러나게 작성하세요(특정 숫자·날짜 금지). 항목마다 '조건 → 기대 결과' 형태를 권장합니다."
      placeholder: |
        예) 시식 입력값이 차감분보다 크면 → 정산 요청이 예외를 던지고 Lot 수량은 요청 전과 동일하게 유지된다.
            시식 입력값이 차감분 이하이면 → 정상 저장되고 판매 수량은 "차감분 − 시식 입력값"으로 기록된다.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 4. 기계 검증 작성 가이드
        이 Issue의 종료 조건(3번 항목)을 판정하는 테스트는 아래 경로·이름 규칙으로 새로 만듭니다.

        ```
        tests/issues/issue-{Issue 번호}-{기능명(영문 kebab-case)}.test.ts
        ```

        예: Issue #42, 팝업 시식 수량 검증 → `tests/issues/issue-42-popup-sample-validation.test.ts`

        - 이 파일의 테스트가 3번 항목의 각 "조건 → 기대 결과"를 하나씩 그대로 검증합니다
        - 3번 항목은 관계로만 표현하지만, 이 테스트 코드 안에서는 그 관계를 만족하는 구체적인 예시 값(숫자·날짜)을
          자유롭게 써도 됩니다 — 값을 금지한 곳은 Issue의 종료 조건 문장이지 테스트 코드가 아닙니다
        - `npm run verify`의 `test` 단계(`vitest run`)에 자동으로 포함되므로 별도 등록이 필요 없습니다
        - 기존 불변식(INV-1~7, SSOT §2.6)과 겹치는 부분이 있으면 기존 테스트 파일(`tests/*.test.ts`)에도
          케이스를 추가하되, 이 Issue 전용 판정은 반드시 `tests/issues/` 파일로 분리합니다

  - type: textarea
    id: verification
    attributes:
      label: "4. 기계 검증 — 어떤 테스트가 판정하는가"
      description: "새로 만들 테스트 파일 경로와, 그 안에서 검증할 케이스를 3번 항목과 1:1로 대응시켜 적어주세요. 관련 불변식(INV-1~7)이 있으면 함께 명시합니다."
      placeholder: |
        예) tests/issues/issue-42-popup-sample-validation.test.ts
            - 케이스1: 시식 입력값 > 차감분인 예시 데이터로 예외 발생 + Lot 수량 불변 확인
            - 케이스2: 시식 입력값 <= 차감분인 예시 데이터로 정상 저장 + 판매 수량 계산값 확인
            - INV-6과 연관, npm run verify의 test 단계 통과가 최종 판정
    validations:
      required: true

  - type: checkboxes
    id: protected-areas
    attributes:
      label: "5. 건드리면 안 되는 것 — 변경 경계 (SSOT §0-1)"
      description: "이번 작업에서 AI가 수정하면 안 되는 보호 영역을 표시하세요. 표시하지 않은 영역은 Issue 범위 안에서 수정 가능한 것으로 간주합니다."
      options:
        - label: "요구사항 문서 (01-requirements.md / SSOT §1) — 읽기만 가능, 변경 금지"
        - label: "아키텍처 문서 (06-architecture.md / SSOT §2) — 읽기만 가능, 변경 금지"
        - label: "하네스 핵심 규칙 (SSOT §0·§0-1) — 읽기만 가능, 변경 금지"
        - label: "검증 스크립트 정책 (scripts/verify-architecture.ts 등) — 실행만 가능, 정책 변경 금지"
        - label: "기타 (아래 5-1에 구체적으로 명시)"

  - type: textarea
    id: protected-areas-note
    attributes:
      label: "5-1. 건드리면 안 되는 것 — 추가 설명"
      description: "위 체크박스 외에 구체적으로 손대면 안 되는 파일·로직·화면이 있으면 적어주세요."
    validations:
      required: false

  - type: dropdown
    id: max-loop
    attributes:
      label: "6. 구현 루프 최대 횟수 — 몇 번까지 재시도하는가"
      description: "검증 실패 시 에이전트가 자동으로 재시도할 최대 횟수. 초과하면 재시도를 멈추고 NEED_HUMAN으로 전환합니다. 시도(코드 수정 + npm run verify 1회 실행) 진행 상황은 이 Issue의 코멘트에 기록되어, 세션이 끊겨도 이어서 확인할 수 있습니다 (docs/harness/03-loop.md 참조)."
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "제한 없음 (매 실패마다 사람 확인)"
      default: 2
    validations:
      required: true
